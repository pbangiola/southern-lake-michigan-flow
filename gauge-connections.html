<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gauge-connected river map | Flow Atlas</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>body{margin:0;font:14px system-ui;color:#17252c}header{padding:10px 16px;background:#f4f5f1;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}header a{color:#136185}label{display:inline-flex;gap:5px;align-items:center}select,input{font:inherit}#map{height:calc(100dvh - 110px);min-height:380px}#status{padding:7px 16px;background:#fffef9;font-size:12px}#notice{font-size:12px;color:#5d5141}@media(max-width:650px){#map{height:calc(100dvh - 175px)}}</style></head>
<body><header><h1>Gauge-connected rivers</h1><a href="index.html">← Production atlas</a>

<label><input type="checkbox" id="show-points" checked>Gauges</label>
