name: MAP 1 - Build Illinois river network (one time)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/illinois-confluence-pilot.yml'
permissions:
  contents: write
concurrency:
  group: illinois-network-build
  cancel-in-progress: false
jobs:
  traverse:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geometry dependencies
        run: python -m pip install shapely lxml
      - name: Test traversal
        run: python scripts/test_traverse_edna_graph.py
      - name: Fetch source stream geometry
        run: |
          mkdir -p local/edna
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve("https://edna.usgs.gov/watersheds/sheds/mississippi/mississippi.kmz", "local/edna/mississippi.kmz")
          PY
      - name: Traverse all reachable branches
        run: |
          python scripts/traverse_edna_graph.py local/edna/mississippi.kmz --limit 100000000 --output data/illinois_river_network.geojson
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("data/illinois_graph_state.json").read_text())
          if not state.get("complete"):
              raise SystemExit("Traversal incomplete: refusing to publish partial network as complete")
          network=json.loads(Path("data/illinois_river_network.geojson").read_text())
          print("New segments:",len(network["features"]))
          print("Total processed edges:",state["processed"])
          PY
      - name: Publish completed network
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/illinois_graph_state.json data/illinois_river_network.geojson
          if ! git diff --cached --quiet; then
            git commit -m "Publish completed Illinois river network"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: illinois-network-build-diagnostics
          path: |
            data/illinois_graph_state.json
            data/illinois_river_network.geojson
          if-no-files-found: ignore
