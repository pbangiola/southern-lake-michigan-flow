name: Build authoritative statewide river network

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/statewide-rivers.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial dependencies
        run: python -m pip install 'shapely>=2,<3'
      - name: Download USGS 3DHP flowlines
        run: |
          python scripts/download_3dhp_flowlines.py \
            --bbox -91.6 36.9 -87.0 42.6 \
            --output local/usgs_3dhp_flowlines.geojson
      - name: Assign directed river identities
        run: |
          python scripts/prepare_authoritative_rivers.py \
            local/usgs_3dhp_flowlines.geojson \
            --output local/authoritative_named_rivers.geojson
      - name: Attach existing stage gauge associations
        run: |
          python scripts/attach_stage_gauges.py \
            local/authoritative_named_rivers.geojson \
            --gauges-network data/river_segments.geojson \
            --output local/named_rivers_with_stage.geojson
      - name: Summarize coverage
        run: |
          python - <<'PY'
          import json
          d=json.load(open('local/named_rivers_with_stage.geojson'))
          print(json.dumps(d['metadata'],indent=2)[:15000])
          PY
      - name: Save candidate data for review (do not publish)
        uses: actions/upload-artifact@v4
        with:
          name: statewide-river-candidate
          path: |
            local/named_rivers_with_stage.geojson
            local/authoritative_named_rivers.geojson
          retention-days: 14
