name: Adaptive atlas expansion
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: launch-data-writers
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Benchmark and expand each layer within download and time budgets
        run: python3 scripts/benchmark_expansion.py --budget-seconds 240 --budget-mb 25 --max-requests 24
      - name: Publish incremental datasets
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas-expansion
          for f in data/expansion_progress.json data/expansion_pace.json data/putins_expansion.geojson data/river_expansion.geojson data/gauges_expansion.geojson; do
            if test -f "$f"; then cp "$f" /tmp/atlas-expansion/; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/atlas-expansion/* data/
            for f in data/expansion_progress.json data/expansion_pace.json; do
              if test -f "$f"; then git add "$f"; fi
            done
            for f in data/putins_expansion.geojson data/river_expansion.geojson data/gauges_expansion.geojson; do
              if test -f "$f"; then git add "$f"; fi
            done
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Expand atlas by one small geographic tile"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
