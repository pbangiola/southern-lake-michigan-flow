name: Discover regional put-ins
on:
  schedule:
    - cron: '41 11 * * 2,5'
  push:
    branches: [main]
    paths:
      - 'scripts/discover_putins.py'
      - '.github/workflows/discover-putins.yml'
      - 'data/putins_discovery_progress.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: discover-putins
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISCOVERY_BATCH_SIZE: '20'
    steps:
      - uses: actions/checkout@v4
      - name: Check discovery Python syntax
        run: python3 -m py_compile scripts/discover_putins.py
      - name: Discover launches in stream rectangles
        id: scan
        continue-on-error: true
        run: python3 -u scripts/discover_putins.py
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: putin-discovery-coverage
          path: data/putins_discovery_coverage.json
          if-no-files-found: warn
      - name: Commit candidate dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/putins_osm_candidates.geojson data/putins_discovery_coverage.json data/putins_discovery_progress.json
          if ! git diff --cached --quiet; then
            git commit -m "Discover put-ins in stream rectangle batch"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report scan failures
        if: steps.scan.outcome == 'failure'
        run: exit 1
