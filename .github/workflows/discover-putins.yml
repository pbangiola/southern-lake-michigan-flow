name: Discover regional put-ins
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Discover candidate access points from OSM
        run: python3 scripts/discover_putins.py
      - name: Commit review dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/putins_osm_candidates.geojson
          if ! git diff --cached --quiet; then
            git commit -m "Update regional put-in candidates"
            git push
          fi
