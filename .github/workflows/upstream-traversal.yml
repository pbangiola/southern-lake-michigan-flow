name: Upstream watershed traversal
on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
permissions:
  contents: write
concurrency:
  group: upstream-watershed-traversal
  cancel-in-progress: false
jobs:
  traverse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Traverse verified flow-direction network
        shell: bash
        run: |
          if [ ! -f data/directed_reaches.geojson ]; then
            echo "::error::Missing data/directed_reaches.geojson: directed hydrography must be imported before traversal can run."
            exit 1
          fi
          python scripts/traverse_upstream.py --network data/directed_reaches.geojson --limit 1000
      - name: Persist progress
        shell: bash
        run: |
          if [ ! -f data/upstream_traversal_state.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/upstream_traversal_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Advance upstream watershed traversal checkpoint"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-traversal-batch
          path: local/upstream_batch.geojson
          if-no-files-found: ignore
