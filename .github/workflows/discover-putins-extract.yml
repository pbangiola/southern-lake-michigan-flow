name: Discover put-ins from OSM extracts
on:
  workflow_dispatch:
    inputs:
      allow_download:
        description: 'Download state extracts only if they are not cached (about 1.1 GB)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: launch-data-writers
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install streaming OSM parser
        run: python3 -m pip install --user osmium
      - name: Restore cached OSM extracts
        uses: actions/cache@v4
        with:
          path: /tmp/*-latest.osm.pbf
          key: osm-state-extracts-v1
      - name: Use cached extracts; download only with explicit permission
        env:
          ALLOW_DOWNLOAD: ${{ inputs.allow_download }}
        run: |
          set -euo pipefail
          for state in illinois indiana michigan wisconsin; do
            file="/tmp/${state}-latest.osm.pbf"
            if test -s "$file"; then
              echo "Reusing cached $state extract"
            elif test "$ALLOW_DOWNLOAD" = true; then
              echo "Downloading missing $state extract"
              curl --fail --location --retry 3 --retry-delay 10 --output "$file" "https://download.geofabrik.de/north-america/us/${state}-latest.osm.pbf"
            else
              echo "::error::No cached $state extract. Previous runner downloads are ephemeral. No download attempted."
              exit 1
            fi
          done
      - name: Extract launch coordinates
        run: python3 -u scripts/discover_putins_extract.py
      - name: Upload extraction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: putin-extract-report
          path: data/putins_extract_report.json
          if-no-files-found: warn
      - name: Publish extraction with conflict-safe retry
        run: |
          set -euo pipefail
          # Preserve the freshly extracted files separately from the checkout.
          cp data/putins_osm_candidates.geojson /tmp/fresh-putins.geojson
          cp data/putins_extract_report.json /tmp/fresh-putins-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/fresh-putins.geojson data/putins_osm_candidates.geojson
            cp /tmp/fresh-putins-report.json data/putins_extract_report.json
            git add data/putins_osm_candidates.geojson data/putins_extract_report.json
            if git diff --cached --quiet; then
              echo "Extracted data already published."
              exit 0
            fi
            git commit -m "Discover put-ins from regional OSM extracts"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected; retrying publication ($attempt/5)"
            sleep 3
          done
          echo "::error::Could not publish after five attempts"
          exit 1
