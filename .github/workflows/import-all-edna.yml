name: MAP 2 - Import all EDNA watersheds once
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-all-edna.yml'
  schedule:
    - cron: '11 * * * *'
permissions:
  contents: write
concurrency:
  group: edna-all-watersheds
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check completion
        id: check
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('data/edna_watersheds/manifest.json')
          done=p.exists() and json.loads(p.read_text()).get('complete') is True
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('done='+str(done).lower()+'\n')
          PY
      - uses: actions/setup-python@v5
        if: steps.check.outputs.done != 'true'
        with:
          python-version: '3.11'
      - name: Install geometry parser
        if: steps.check.outputs.done != 'true'
        run: python -m pip install shapely lxml
      - name: Import every indexed watershed KMZ
        if: steps.check.outputs.done != 'true'
        run: python -u scripts/import_all_edna.py
      - name: Publish all layers and completion manifest together
        if: steps.check.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/edna_watersheds/
          git commit -m "Publish all indexed EDNA watershed layers"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: edna-import-diagnostics
          path: data/edna_watersheds/manifest.json
          if-no-files-found: ignore
