name: MAP 3 - Build nationwide river vector tiles
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-edna-tiles.yml'
      - 'scripts/build_edna_tiles.py'
      - 'data/edna_watersheds/manifest.json'
permissions:
  contents: write
concurrency:
  group: edna-vector-tiles
  cancel-in-progress: false
jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check national EDNA import
        run: |
          python - <<'PY'
          import json
          m=json.load(open('data/edna_watersheds/manifest.json'))
          assert m.get('complete') is True and m.get('bbox')==[-180.0,18.0,-65.0,72.0], 'National import not yet published'
          PY
      - name: Install tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe
      - name: Generate national vector tiles
        run: python -u scripts/build_edna_tiles.py
      - name: Publish tile pyramid
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/edna_tiles/
          git commit -m "Publish nationwide EDNA vector tiles"
          git pull --rebase origin main
          git push origin HEAD:main
