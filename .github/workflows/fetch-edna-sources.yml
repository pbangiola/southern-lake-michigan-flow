name: Fetch EDNA watershed sources
on:
  workflow_dispatch:
  schedule:
    - cron: '11 3 * * *'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and validate Mississippi and Great Lakes archives
        run: python scripts/fetch_edna_sources.py
      - name: Archive source files and manifest
        uses: actions/upload-artifact@v4
        with:
          name: edna-mississippi-greatlakes
          path: local/edna/
          retention-days: 30
