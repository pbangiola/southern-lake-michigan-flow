name: Refresh stream gauges
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-stream-gauges
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests
      - name: Fetch current USGS gauge readings
        run: python -u scripts/fetch_gauges.py
      - name: Check generated GeoJSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/gauges.geojson')
          d=json.loads(p.read_text())
          features=d.get('features',[])
          assert d.get('type')=='FeatureCollection' and len(features)>=50, 'Unexpectedly small or invalid gauge dataset'
          assert any(f.get('properties',{}).get('stage') is not None for f in features), 'No current stage readings'
          print(f'Validated {len(features)} gauge features')
          PY
      - name: Commit readings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gauges.geojson
          if ! git diff --cached --quiet; then
            git commit -m "Refresh USGS stream gauge readings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
