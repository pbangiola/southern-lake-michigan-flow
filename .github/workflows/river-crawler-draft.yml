name: Incremental river crawler
on:
  workflow_dispatch:
  schedule:
    - cron: '19 7 * * 2,5'
permissions:
  contents: write
concurrency:
  group: river-crawler-publish
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover river-adjacent gauge and launch candidates
        run: |\n          mkdir -p local\n          if [ -f data/river_crawler_state.json ]; then cp data/river_crawler_state.json local/river_crawler_state.json; fi\n          python scripts/river_crawler.py --network data/river_segments_3dhp_review.geojson --max-boxes 3
      - name: Validate and publish candidate map data
        run: python scripts/publish_crawler_candidates.py
      - name: Persist crawler cursor and validated candidates
        run: |
          mkdir -p data
          cp local/river_crawler_state.json data/river_crawler_state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/river_crawler_state.json\n          for file in data/gauges_expansion.geojson data/putins_expansion.geojson; do\n            if [ -f "$file" ]; then git add "$file"; fi\n          done
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated incremental river discoveries"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: river-crawler-candidates
          path: local/river_crawler/
          retention-days: 14
